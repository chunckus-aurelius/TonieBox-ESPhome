esphome:
  name: tonie-the-example
  friendly_name: Tonie The Example
  on_boot:
    - priority: 1100
      then:
        - lambda: |-
            static_assert(CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM == 10, "WiFi buffer override lost, see network: block");
            static_assert(CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM == 32, "WiFi buffer override lost, see network: block");
            static_assert(CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM == 32, "WiFi buffer override lost, see network: block");
            static_assert(CONFIG_ESP_WIFI_RX_BA_WIN == 6, "WiFi buffer override lost, see network: block");

            gpio_deep_sleep_hold_dis();
            gpio_hold_dis(GPIO_NUM_45);
            gpio_hold_dis(GPIO_NUM_47);
            gpio_hold_dis(GPIO_NUM_7);
            gpio_hold_dis(GPIO_NUM_20);
            gpio_hold_dis(GPIO_NUM_21);

            gpio_reset_pin(GPIO_NUM_45);
            gpio_set_direction(GPIO_NUM_45, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_45, 1);
            gpio_reset_pin(GPIO_NUM_47);
            gpio_set_direction(GPIO_NUM_47, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_47, 0);

            gpio_reset_pin(GPIO_NUM_26);
            gpio_set_direction(GPIO_NUM_26, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_26, 0);
            delay(10);
            gpio_set_level(GPIO_NUM_26, 1);
            delay(10);

            delay(250);

    - priority: -100
      then:
        - deep_sleep.prevent: box_deep_sleep
        - script.execute: led_update
        - lambda: |-
            switch (esp_sleep_get_wakeup_cause()) {
              case ESP_SLEEP_WAKEUP_EXT1:
                id(last_wake_cause).publish_state("ear or charger");
                break;
              case ESP_SLEEP_WAKEUP_TIMER:
                id(last_wake_cause).publish_state("wake timer");
                break;
              default:
                id(last_wake_cause).publish_state("cold boot");
                break;
            }

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_UART_DEFAULT: y
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "10"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_RX_BA_WIN: "6"

external_components:
  - source:
      type: git
      url: https://github.com/chunckus-aurelius/TonieBox-ESPhome
      ref: main
    components: [trf7962a_nfc, tlv320dac3100, lis3dh]

logger:
  level: DEBUG
  hardware_uart: UART0
  logs:
    sensor: WARN
    text_sensor: INFO
    script: INFO
    preferences: INFO
    trf7962a_nfc: INFO

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - lambda: 'id(sleep_armed) = true;'

ota:
  - platform: esphome
    encryption:

network:
  enable_high_performance: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  id: toniebox_spi
  mosi_pin: GPIO2
  miso_pin:
    number: GPIO3
    ignore_strapping_warning: true
  clk_pin: GPIO4

i2c:
  id: toniebox_i2c
  sda: GPIO5
  scl: GPIO6
  frequency: 400kHz
  scan: true

i2s_audio:
  id: toniebox_i2s
  i2s_lrclk_pin: GPIO12
  i2s_bclk_pin: GPIO11

trf7962a_nfc:
  id: nfc_reader
  spi_id: toniebox_spi
  cs_pin: GPIO1
  irq_pin: GPIO13
  update_interval: 500ms
  on_tag:
    then:
      - lambda: |-
          std::string uid = x;
          uid.erase(std::remove(uid.begin(), uid.end(), '-'), uid.end());
          id(nfc_tag_uid).publish_state(uid);

      - homeassistant.tag_scanned: !lambda 'return id(nfc_tag_uid).state;'
      - script.execute: idle_timer
  on_tag_removed:
    then:
      - lambda: 'id(nfc_tag_uid).publish_state("none");'
      - script.execute: idle_timer

text_sensor:
  - platform: template
    id: nfc_tag_uid
    name: "NFC Tag UID"
    icon: "mdi:nfc-variant"
    update_interval: never

  - platform: template
    id: last_wake_cause
    name: "Last Wake Cause"
    icon: "mdi:sleep-off"
    entity_category: diagnostic
    update_interval: never

audio_dac:
  - platform: tlv320dac3100
    id: audio_codec
    i2c_id: toniebox_i2c
    address: 0x18
    sample_rate: 44100
    output: SPEAKER
    speaker_gain: 24dB

speaker:
  - platform: i2s_audio
    id: toniebox_i2s_speaker
    i2s_audio_id: toniebox_i2s
    dac_type: external
    i2s_dout_pin: GPIO10
    sample_rate: 44100
    audio_dac: audio_codec
    buffer_duration: 100ms

  - platform: mixer
    id: toniebox_mixer
    output_speaker: toniebox_i2s_speaker
    source_speakers:
      - id: toniebox_media_mixer_input
        buffer_duration: 60ms
      - id: toniebox_announcement_mixer_input
        buffer_duration: 60ms

  - platform: resampler
    id: toniebox_media_resampling_input
    output_speaker: toniebox_media_mixer_input
    buffer_duration: 60ms

  - platform: resampler
    id: toniebox_announcement_resampling_input
    output_speaker: toniebox_announcement_mixer_input
    buffer_duration: 60ms

media_player:
  - platform: speaker
    id: toniebox_media_player
    name: "Speaker"
    buffer_size: 32768
    media_pipeline:
      speaker: toniebox_media_resampling_input
      format: MP3
      sample_rate: 44100
      num_channels: 1
    announcement_pipeline:
      speaker: toniebox_announcement_resampling_input
      format: MP3
      sample_rate: 44100
      num_channels: 1
    on_state:
      - script.execute: idle_timer
      - script.execute: clamp_volume

lis3dh:
  id: accelerometer
  i2c_id: toniebox_i2c
  address: 0x19
  update_interval: 200ms
  click:
    threshold: 40
    time_limit: 10
    time_latency: 20
    time_window: 100
    on_click:
      - if:
          condition:
            lambda: |-
              const float x = id(accel_x).state;
              const float y = id(accel_y).state;
              const float z = id(accel_z).state;
              if (isnan(x) || isnan(y) || isnan(z)) return false;
              if (x > -0.80f) return false;
              if (fabsf(y + z) > 0.25f) return false;
              return (millis() - id(last_tap_ms)) > 400;

          then:
            - lambda: 'id(last_tap_ms) = millis();'
            - logger.log:
                format: "tap: CLICK_SRC=0x%02X"
                args: ['src']
            - homeassistant.event:
                event: esphome.tonie_tap
                data:
                  axis: !lambda |-
                    if (src & 0x01) return "x";
                    if (src & 0x02) return "y";
                    return "z";

                  side: !lambda 'return (src & 0x08) ? "neg" : "pos";'
            - script.execute: idle_timer
  x:
    id: accel_x
    name: "Accelerometer X"
    filters:
      - delta: 0.05
  y:
    id: accel_y
    name: "Accelerometer Y"
    filters:
      - delta: 0.05
  z:
    id: accel_z
    name: "Accelerometer Z"
    filters:
      - delta: 0.05

output:
  - platform: ledc
    id: led_blue_output
    pin: GPIO17
  - platform: ledc
    id: led_green_output
    pin: GPIO18
  - platform: ledc
    id: led_red_output
    pin: GPIO19

light:
  - platform: rgb
    id: box_led
    name: "LED"
    red: led_red_output
    green: led_green_output
    blue: led_blue_output
    effects:
      - pulse:
          name: "Charged"
          transition_length: 1.5s
          update_interval: 1.5s

time:
  - platform: homeassistant
    id: ha_time

datetime:
  - platform: template
    id: wake_alarm_time
    name: "Wake Alarm Time"
    icon: "mdi:alarm-check"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
    entity_category: config

deep_sleep:
  id: box_deep_sleep

number:
  - platform: template
    id: sleep_timeout
    name: "Sleep Timeout"
    icon: "mdi:timer-outline"
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 0
    max_value: 120
    step: 1
    unit_of_measurement: min
    mode: box
    on_value:
      - script.execute: idle_timer

  - platform: template
    id: wake_interval
    name: "Wake Interval"
    icon: "mdi:timer-sync-outline"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 720
    step: 5
    unit_of_measurement: min
    mode: box
    entity_category: config

  - platform: template
    id: bedtime_minutes
    name: "Bedtime Timer"
    icon: "mdi:weather-night"
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 5
    max_value: 120
    step: 5
    unit_of_measurement: min
    mode: box

  - platform: template
    id: max_volume
    name: "Max Volume"
    icon: "mdi:volume-high"
    optimistic: true
    restore_value: true
    initial_value: 70
    min_value: 10
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    on_value:
      - script.execute: clamp_volume

  - platform: template
    id: tap_threshold
    name: "Tap Threshold"
    icon: "mdi:gesture-tap"
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 1
    max_value: 127
    step: 1
    mode: slider
    on_value:
      - lambda: 'id(accelerometer)->set_click_threshold((uint8_t) x);'
  - platform: template
    id: tap_time_limit
    name: "Tap Time Limit"
    icon: "mdi:gesture-tap"
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    on_value:
      - lambda: 'id(accelerometer)->set_click_time_limit((uint8_t) x);'

globals:
  - id: sleep_armed
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: bedtime_running
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: tilt_dir
    type: int
    restore_value: false
    initial_value: '0'
  - id: tilt_armed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: tilt_held
    type: int
    restore_value: false
    initial_value: '0'
  - id: tilt_fire
    type: int
    restore_value: false
    initial_value: '0'

  - id: last_battery_pct
    type: float
    restore_value: true
    initial_value: '-1'

  - id: charge_peak_v
    type: float
    restore_value: false
    initial_value: '0'
  - id: charge_full
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: charge_drop_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: last_tap_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: restart_held
    type: int
    restore_value: false
    initial_value: '0'
  - id: restart_fire
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  - id: led_update
    then:
      - if:
          condition:
            and:
              - switch.is_on: status_led
              - lambda: 'return !id(bedtime_running);'
          then:
            - if:
                condition:
                  lambda: 'return id(charge_sense).state > 4.0f;'
                then:
                  - if:
                      condition:
                        lambda: 'return id(charge_full);'
                      then:
                        - light.turn_on:
                            id: box_led
                            brightness: 70%
                            red: 0%
                            green: 100%
                            blue: 0%
                            effect: "Charged"
                      else:
                        - light.turn_on:
                            id: box_led
                            brightness: 70%
                            effect: "None"
                            blue: 0%
                            red: !lambda |-
                              const float f = id(charge_progress).state;
                              if (isnan(f)) return 0.0f;
                              return 1.0f - (f / 100.0f);

                            green: !lambda |-
                              const float f = id(charge_progress).state;
                              if (isnan(f)) return 1.0f;
                              return f / 100.0f;

                else:
                  - if:
                      condition:
                        lambda: |-
                          const float b = id(battery_level).state;
                          return !isnan(b) && b < 20.0f;

                      then:
                        - light.turn_on:
                            id: box_led
                            brightness: 70%
                            effect: "None"
                            red: 100%
                            green: 50%
                            blue: 0%
                      else:
                        - light.turn_on:
                            id: box_led
                            brightness: 70%
                            effect: "None"
                            red: 0%
                            green: 100%
                            blue: 0%

  - id: bedtime_start
    mode: restart
    then:
      - lambda: 'id(bedtime_running) = true;'
      - light.turn_on:
          id: box_led
          brightness: 70%
          effect: "None"
          red: 100%
          green: 40%
          blue: 0%
      - delay: !lambda |-
          const int ms = (int) id(bedtime_minutes).state * 60000 - 60000;
          return ms > 0 ? ms : 0;

      - light.turn_on:
          id: box_led
          brightness: 0%
          transition_length: 60s
      - delay: 65s
      - lambda: 'id(bedtime_running) = false;'
      - script.execute: box_power_down
      - switch.turn_off: bedtime

  - id: clamp_volume
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(toniebox_media_player).volume > id(max_volume).state / 100.0f;'
          then:
            - media_player.volume_set:
                id: toniebox_media_player
                volume: !lambda 'return id(max_volume).state / 100.0f;'

  - id: idle_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(sleep_timeout).state > 0;'
          then:
            - delay: !lambda 'return id(sleep_timeout).state * 60000;'
            - script.execute: box_power_down

  - id: box_power_down
    then:
      - if:
          condition:
            lambda: 'return id(sleep_armed);'
          then:
            - if:
                condition:
                  lambda: |-
                    return gpio_get_level(GPIO_NUM_20) == 0 ||
                           gpio_get_level(GPIO_NUM_21) == 0;

                then:
                  - logger.log: "sleep deferred: an ear is still held"
                  - script.execute: idle_timer
                else:
                  - media_player.stop:
                  - light.turn_off: box_led
                  - lambda: |-
                      uint8_t page0[2] = {0x00, 0x00};
                      uint8_t page1[2] = {0x00, 0x01};
                      uint8_t dac_mute[2] = {0x40, 0x0C};
                      uint8_t spk_mute[2] = {0x2A, 0x00};
                      uint8_t amp_off[2] = {0x20, 0x06};
                      uint8_t reset[2] = {0x01, 0x01};
                      id(toniebox_i2c)->write(0x18, page0, 2);
                      id(toniebox_i2c)->write(0x18, dac_mute, 2);
                      delay(20);
                      id(toniebox_i2c)->write(0x18, page1, 2);
                      id(toniebox_i2c)->write(0x18, spk_mute, 2);
                      id(toniebox_i2c)->write(0x18, amp_off, 2);
                      delay(20);
                      id(toniebox_i2c)->write(0x18, page0, 2);
                      id(toniebox_i2c)->write(0x18, reset, 2);

                      gpio_set_level(GPIO_NUM_45, 0);
                      gpio_set_level(GPIO_NUM_47, 1);

                      gpio_hold_en(GPIO_NUM_45);
                      gpio_hold_en(GPIO_NUM_47);
                      gpio_deep_sleep_hold_en();

                  - lambda: |-
                      gpio_config_t wake_cfg = {};
                      wake_cfg.pin_bit_mask = 1ULL << 7;
                      wake_cfg.mode = GPIO_MODE_INPUT;
                      wake_cfg.pull_up_en = GPIO_PULLUP_ENABLE;
                      gpio_config(&wake_cfg);
                      delayMicroseconds(50);

                      uint64_t mask = (1ULL << 20) | (1ULL << 21);
                      if (gpio_get_level(GPIO_NUM_7) != 0)
                        mask |= (1ULL << 7);

                      const gpio_num_t pins[] = {GPIO_NUM_7, GPIO_NUM_20, GPIO_NUM_21};
                      for (gpio_num_t pin : pins) {
                        if (mask & (1ULL << pin)) {
                          gpio_sleep_set_pull_mode(pin, GPIO_PULLUP_ONLY);
                          gpio_sleep_set_direction(pin, GPIO_MODE_INPUT);
                          gpio_hold_en(pin);
                        }
                      }
                      gpio_deep_sleep_hold_en();

                      ESP_LOGD("sleep", "ext1 mask 0x%llX (charger %s)", mask,
                               (mask & (1ULL << 7)) ? "absent" : "docked");
                      esp_sleep_enable_ext1_wakeup(mask, ESP_EXT1_WAKEUP_ANY_LOW);

                  - lambda: |-
                      uint32_t secs = 0;
                      const char *src = "none";

                      if (id(wake_interval).state > 0.0f) {
                        secs = (uint32_t)(id(wake_interval).state * 60.0f);
                        src = "interval";
                      }

                      if (id(wake_alarm_enabled).state) {
                        auto now = id(ha_time).now();
                        if (now.is_valid()) {
                          const int32_t now_s = now.hour * 3600 +
                                                now.minute * 60 + now.second;
                          const int32_t tgt_s = id(wake_alarm_time).hour * 3600 +
                                                id(wake_alarm_time).minute * 60 +
                                                id(wake_alarm_time).second;
                          int32_t d = tgt_s - now_s;
                          if (d <= 0) d += 86400;
                          d -= 120;
                          if (d < 60) d = 60;
                          if (secs == 0 || (uint32_t)d < secs) {
                            secs = (uint32_t)d;
                            src = "alarm";
                          }
                        } else {
                          ESP_LOGW("sleep", "wake alarm on but HA time is not valid -- not armed");
                        }
                      }

                      if (secs > 0) {
                        ESP_LOGD("sleep", "timer wake in %us (%s)", (unsigned) secs, src);
                        esp_sleep_enable_timer_wakeup((uint64_t) secs * 1000000ULL);
                      }

                  - deep_sleep.allow: box_deep_sleep
                  - deep_sleep.enter: box_deep_sleep
          else:
            - logger.log: "power down refused: HA has never connected"

interval:
  - interval: 10s
    then:
      - if:
          condition:
            or:
              - and:
                  - switch.is_on: awake_on_charger
                  - lambda: 'return id(charge_sense).state > 4.0f;'
              - lambda: 'return id(bedtime_running);'
              - lambda: |-
                  auto s = id(toniebox_media_player).state;
                  return s == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                         s == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;

          then:
            - script.execute: idle_timer
      - script.execute: led_update

  - interval: 200ms
    then:
      - lambda: |-
          id(tilt_fire) = 0;
          const float x = id(accel_x).state;
          const float y = id(accel_y).state;
          const float z = id(accel_z).state;
          if (isnan(x) || isnan(y) || isnan(z)) return;
          if (x > -0.30f) {
            id(tilt_dir) = 0;
            id(tilt_held) = 0;
            return;
          }
          const float s = y + z;

          if (fabsf(s) < 0.25f) {
            id(tilt_armed) = true;
            id(tilt_dir) = 0;
            id(tilt_held) = 0;
            return;
          }
          if (!id(tilt_armed)) return;
          if (fabsf(s) < 0.40f) return;

          const int dir = (s > 0.0f) ? 1 : -1;
          if (dir != id(tilt_dir)) {
            id(tilt_dir) = dir;
            id(tilt_held) = 0;
            id(tilt_fire) = dir;
            return;
          }

          id(tilt_held) += 1;
          if (id(tilt_held) > 150) {
            id(tilt_armed) = false;
            id(tilt_dir) = 0;
            return;
          }
          if (id(tilt_held) % 3 == 0)
            id(tilt_fire) = dir;

      - if:
          condition:
            lambda: 'return id(tilt_fire) != 0;'
          then:
            - homeassistant.event:
                event: esphome.tonie_tilt
                data:
                  side: !lambda 'return id(tilt_fire) > 0 ? "pos" : "neg";'
            - script.execute: idle_timer

  - interval: 200ms
    then:
      - lambda: |-
          id(restart_fire) = false;
          const float x = id(accel_x).state;
          if (isnan(x)) { id(restart_held) = 0; return; }
          if (x < 0.70f) { id(restart_held) = 0; return; }
          if (!id(ear_big_button).state || !id(ear_small_button).state) {
            id(restart_held) = 0;
            return;
          }
          id(restart_held) += 1;
          if (id(restart_held) < 50) return;
          id(restart_held) = 0;
          id(restart_fire) = true;

      - if:
          condition:
            lambda: 'return id(restart_fire);'
          then:
            - logger.log:
                level: WARN
                tag: "restart"
                format: "restart gesture: upside down + both ears 10s"
            - light.turn_on:
                id: box_led
                effect: "None"
            - light.turn_on:
                id: box_led
                brightness: 100%
                transition_length: 0s
                red: 0%
                green: 0%
                blue: 100%
            - delay: 200ms
            - light.turn_off:
                id: box_led
                transition_length: 0s
            - delay: 200ms
            - light.turn_on:
                id: box_led
                brightness: 100%
                transition_length: 0s
                red: 0%
                green: 0%
                blue: 100%
            - delay: 200ms
            - lambda: 'App.safe_reboot();'

switch:
  - platform: template
    id: box_power
    name: "Power"
    icon: "mdi:power"
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - script.execute: idle_timer
      - script.execute: led_update
    turn_off_action:
      - script.execute: box_power_down

  - platform: template
    id: bedtime
    name: "Bedtime"
    icon: "mdi:sleep"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: bedtime_start
    turn_off_action:
      - script.stop: bedtime_start
      - lambda: 'id(bedtime_running) = false;'
      - script.execute: led_update

  - platform: template
    id: status_led
    name: "Status LED"
    icon: "mdi:led-on"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: led_update
    turn_off_action:
      - logger.log: "status LED off -- Home Assistant owns the LED now"

  - platform: template
    id: awake_on_charger
    name: "Stay Awake on Charger"
    icon: "mdi:power-plug-battery"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: wake_alarm_enabled
    name: "Wake Alarm"
    icon: "mdi:alarm"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

binary_sensor:
  - platform: gpio
    id: ear_big_button
    name: "Ear Big Button"
    pin:
      number: GPIO20
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 800ms
        then:
          - media_player.volume_up:
          - script.execute: idle_timer
      - min_length: 1s
        max_length: 12s
        then:
          - if:
              condition:
                lambda: |-
                  const float x = id(accel_x).state;
                  return isnan(x) || x < 0.85f;

              then:
                - switch.turn_on: box_power
  - platform: gpio
    id: ear_small_button
    name: "Ear Small Button"
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 800ms
        then:
          - media_player.volume_down:
          - script.execute: idle_timer
      - min_length: 1s
        max_length: 12s
        then:
          - if:
              condition:
                lambda: |-
                  const float x = id(accel_x).state;
                  return isnan(x) || x < 0.85f;

              then:
                - switch.turn_off: box_power
  - platform: gpio
    id: headphone_detect
    name: "Headphone Detect"
    pin: GPIO48

sensor:
  - platform: adc
    id: charge_sense
    name: "Charge Sense"
    pin: GPIO8
    attenuation: 12db
    samples: 16
    update_interval: 60s
    filters:
      - multiply: 2.0
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    pin: GPIO9
    attenuation: 12db
    samples: 16
    update_interval: 60s
    filters:
      - multiply: 4.03
    on_value:
      - sensor.template.publish:
          id: charge_progress
          state: !lambda |-
            if (id(charge_sense).state < 4.0f) {
              id(charge_peak_v) = 0.0f;
              id(charge_full) = false;
              id(charge_drop_count) = 0;
              return NAN;
            }
            if (x > id(charge_peak_v))
              id(charge_peak_v) = x;
            if (!id(charge_full) && id(charge_peak_v) > 4.50f && x < id(charge_peak_v) - 0.02f) {
              id(charge_drop_count) += 1;
              if (id(charge_drop_count) >= 3)
                id(charge_full) = true;
            } else {
              id(charge_drop_count) = 0;
            }
            if (id(charge_full))
              return 100.0f;
            float f = (x - 4.35f) / (4.65f - 4.35f);
            if (f < 0.0f) f = 0.0f;
            if (f > 1.0f) f = 1.0f;
            return f * 100.0f;

      - sensor.template.publish:
          id: battery_level
          state: !lambda |-
            if (id(charge_sense).state > 4.0f) {
              float best = id(last_battery_pct);
              const float prog = id(charge_progress).state;
              if (!isnan(prog) && prog > best)
                best = prog;
              if (best < 0.0f) return NAN;
              return best;
            }

            static const float pts[][2] = {
              {3.00f,   0.0f}, {3.30f,   5.0f}, {3.60f,  15.0f}, {3.67f, 30.0f},
              {3.70f,  45.0f}, {3.80f,  70.0f}, {3.90f,  88.0f}, {4.05f, 100.0f}};
            const int n = sizeof(pts) / sizeof(pts[0]);
            float pct = 100.0f;
            if (x <= pts[0][0]) {
              pct = 0.0f;
            } else if (x < pts[n - 1][0]) {
              for (int i = 1; i < n; i++) {
                if (x <= pts[i][0]) {
                  const float t = (x - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]);
                  pct = pts[i - 1][1] + t * (pts[i][1] - pts[i - 1][1]);
                  break;
                }
              }
            }
            id(last_battery_pct) = pct;
            return pct;

  - platform: template
    id: battery_level
    name: "Battery"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    filters:
      - median:
          window_size: 5
          send_every: 1

  - platform: template
    id: charge_progress
    internal: true
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
