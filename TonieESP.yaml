# TonieESP -- example ESPHome config for ESP32-S3 Toniebox hardware (rev v1.6.C).
#
# This is a working reference config, not a starting skeleton: the pin map,
# boot order and audio buffer sizes are all specific to this board and most of
# them are load-bearing. Comments marked with a warning explain why something
# that looks arbitrary is not. Read those before changing the value next to it.
#
# Pin assignments come from the teddybox project's board_def.h for this
# revision. Custom components live in ./components -- see README.md.

esphome:
  name: tonieesp
  friendly_name: TonieESP
  # Powers the peripheral rails before the I2C bus comes up (BUS = 1000).
  # Both the priority and the single-lambda structure matter.
  on_boot:
    - priority: 1100
      then:
        # ONE LAMBDA ON PURPOSE. Do not split this into separate actions with
        # `- delay:` between them: DelayAction is asynchronous and returns
        # immediately, so the I2C bus would be created part-way through the
        # power-up sequence and every device on it would fail to probe.
        - lambda: |-
            // Release the pin holds left behind by deep sleep, or the pads
            // stay latched and the rails never come back.
            gpio_deep_sleep_hold_dis();
            gpio_hold_dis(GPIO_NUM_45);
            gpio_hold_dis(GPIO_NUM_47);

            // --- audio_board_power(true) ---
            gpio_reset_pin(GPIO_NUM_45);
            gpio_set_direction(GPIO_NUM_45, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_45, 1);   // POWER_GPIO    -> HIGH
            gpio_reset_pin(GPIO_NUM_47);
            gpio_set_direction(GPIO_NUM_47, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_47, 0);   // SD_POWER_GPIO -> LOW (active low)

            // --- DAC3100 hardware reset pulse ---
            gpio_reset_pin(GPIO_NUM_26);
            gpio_set_direction(GPIO_NUM_26, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_26, 0);   // into reset
            delay(10);                        // BLOCKING on purpose
            gpio_set_level(GPIO_NUM_26, 1);   // release
            delay(10);

            // Rail/codec settle before BUS(1000) creates the I2C bus.
            delay(250);
    # NOT the interlock -- that is the sleep_armed guard in box_power_down.
    # begin_sleep(manual=true) skips the prevent_ check entirely, so this only
    # blocks the non-manual re-entry from loop() after a KEEP_AWAKE deferral.
    - priority: -100
      then:
        - deep_sleep.prevent: box_deep_sleep
        # Earliest point the light component is up. Lighting here rather than
        # waiting on the API means the box shows awake during the boot silence.
        - script.execute: led_awake

esp32:
  board: esp32-s3-devkitc-1  # placeholder -- confirm the exact module for your board
  framework:
    type: esp-idf
    # The S3 console defaults to USB_SERIAL_JTAG, which is unreachable on this
    # board -- GPIO19/20 are the red LED and the big ear, so there is no USB
    # port and only ROM output ever reaches the solder pads. `logger:
    # hardware_uart: UART0` alone is NOT enough: it moves ESPHome's app logger
    # but not the IDF console, so the bootloader output still goes to USB and
    # the wire cuts off at `entry 0x...`. That looks exactly like a board
    # hanging in the bootloader when it is in fact booting fine. These force
    # the IDF console itself onto UART0 and drop the unreachable USB secondary.
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_UART_DEFAULT: y
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y

# No psram: block -- PSRAM is absent on this hardware. Every buffer below has
# to fit in internal SRAM, which is why the audio sizes are conservative.

external_components:
  # Consume the components straight from this repository.
  - source:
      type: git
      url: https://github.com/chunckus-aurelius/TonieBox-ESPhome
      ref: main
    components: [trf7962a, dac3100, lis3dh]
  # If you have cloned the repo instead, swap the block above for:
  #   - source:
  #       type: local
  #       path: components

logger:
  level: DEBUG
  # Pairs with the console sdkconfig_options above, so the solder pads carry
  # ESPHome's own log too and not just ROM output.
  hardware_uart: UART0
  logs:
    # Sensor states log at ESP_LOGV per sensor per poll -- ~30 lines/sec here.
    sensor: INFO
    text_sensor: INFO

api:
  encryption:
    key: !secret api_key
  # The real sleep interlock. Nothing else in this file may set sleep_armed.
  on_client_connected:
    - lambda: 'id(sleep_armed) = true;'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  id: toniebox_spi
  mosi_pin: GPIO2
  miso_pin: GPIO3
  clk_pin: GPIO4

i2c:
  id: toniebox_i2c
  sda: GPIO5
  scl: GPIO6
  frequency: 400kHz
  scan: true

i2s_audio:
  id: toniebox_i2s
  i2s_lrclk_pin: GPIO12  # I2S_WS_GPIO
  i2s_bclk_pin: GPIO11   # I2S_BCK_GPIO

trf7962a:
  id: nfc_reader
  spi_id: toniebox_spi
  cs_pin: GPIO1           # SPI_SS_GPIO
  irq_pin: GPIO13         # TRF7962A_IRQ_GPIO
  update_interval: 500ms
  # Reporting the tag to Home Assistant is the only thing the device does with
  # it. Keep the tag automations themselves in HA.
  on_tag_present:
    then:
      # The size guard is a condition rather than an early `return` so that a
      # short read cannot fire tag_scanned with a stale or empty UID and set
      # off the wrong HA automation. `x` is a std::vector<uint8_t>, and
      # tag_scanned wants a std::string, so it reads the formatted UID back
      # off the text sensor published immediately above it.
      - if:
          condition:
            lambda: 'return x.size() >= 8;'
          then:
            - lambda: |-
                char buf[17];
                for (int i = 0; i < 8; i++) {
                  snprintf(&buf[i * 2], 3, "%02X", x[7 - i]);
                }
                id(nfc_tag_uid).publish_state(buf);
            - homeassistant.tag_scanned: !lambda 'return id(nfc_tag_uid).state;'
            - script.execute: idle_timer
  on_tag_removed:
    then:
      - lambda: 'id(nfc_tag_uid).publish_state("none");'
      - script.execute: idle_timer

text_sensor:
  - platform: template
    id: nfc_tag_uid
    name: "NFC Tag UID"
    icon: "mdi:nfc-variant"
    update_interval: never  # pushed from the triggers above

dac3100:
  id: audio_codec
  i2c_id: toniebox_i2c
  address: 0x18

# Topology: i2s speaker <- mixer <- per-source resampler <- media_player.
#
# These sizes are memory-constrained, not arbitrary. With no PSRAM the whole
# pipeline plus the MP3 decoder has to fit in internal SRAM, and 44.1 kHz
# playback only just does. If you raise any buffer here, expect allocation
# failures at runtime rather than at compile time.
speaker:
  - platform: i2s_audio
    id: toniebox_i2s_speaker
    i2s_audio_id: toniebox_i2s
    dac_type: external
    i2s_dout_pin: GPIO10  # I2S_DATA_GPIO
    sample_rate: 44100      # must match the pipelines below
    buffer_duration: 100ms  # 150ms does not fit at this rate

  - platform: mixer
    id: toniebox_mixer
    output_speaker: toniebox_i2s_speaker
    source_speakers:
      - id: toniebox_media_mixer_input
        buffer_duration: 60ms
      - id: toniebox_announcement_mixer_input
        buffer_duration: 60ms

  - platform: resampler
    id: toniebox_media_resampling_input
    output_speaker: toniebox_media_mixer_input
    buffer_duration: 60ms

  - platform: resampler
    id: toniebox_announcement_resampling_input
    output_speaker: toniebox_announcement_mixer_input
    buffer_duration: 60ms

# Advertised to Home Assistant; a streaming source such as Music Assistant
# encodes to match. `format:` also decides which decoder gets compiled in.
# These rates MUST equal the i2s speaker's sample_rate above.
media_player:
  - platform: speaker
    id: toniebox_media_player
    # Deliberately short: ESPHome prefixes friendly_name, so a longer name
    # here would repeat the device name inside the entity ID.
    name: "Speaker"
    buffer_size: 32768  # the MP3 decoder itself costs ~116KB on top of this
    media_pipeline:
      speaker: toniebox_media_resampling_input
      format: MP3
      sample_rate: 44100
      num_channels: 1
    announcement_pipeline:
      speaker: toniebox_announcement_resampling_input
      format: MP3
      sample_rate: 44100
      num_channels: 1
    # Playback counts as activity, so the box never sleeps mid-track.
    on_state:
      - script.execute: idle_timer
      - script.execute: clamp_volume

rtttl:
  id: toniebox_rtttl
  speaker: toniebox_i2s_speaker

# Proves I2S -> DAC -> amp -> speaker with no network or decoder involved.
# Useful as the first thing to try after a fresh flash.
button:
  - platform: template
    name: "Play Test Tone"
    id: play_test_tone
    on_press:
      - rtttl.play: "two_short:d=4,o=5,b=100:16e6,16e6"

# Some board revisions populate an MMA8451 here instead. If setup fails to
# find WHO_AM_I, that is likely why.
lis3dh:
  id: accelerometer
  i2c_id: toniebox_i2c
  address: 0x19
  # 250ms, not 1s: the movement LED below reads these, and a second of lag
  # makes it feel broken. The delta filters keep HA traffic down regardless.
  update_interval: 250ms
  x:
    id: accel_x
    name: "Accelerometer X"
    filters:
      - delta: 0.02
  y:
    id: accel_y
    name: "Accelerometer Y"
    filters:
      - delta: 0.02
  z:
    id: accel_z
    name: "Accelerometer Z"
    filters:
      - delta: 0.02

# DO NOT add gpio outputs for GPIO45 (POWER_GPIO) or GPIO47 (SD_POWER_GPIO).
# GPIOBinaryOutput::setup() calls turn_off() at HARDWARE(800) -- after the bus
# is already up -- which kills the peripheral rail out from under everything.
# Those two pins belong to the on_boot lambda and nowhere else.
output:
  - platform: ledc
    id: led_blue_output
    pin: GPIO17
  - platform: ledc
    id: led_green_output
    pin: GPIO18
  - platform: ledc
    id: led_red_output
    pin: GPIO19

# Big ear wakes the box. GPIO20 is also the button binary_sensor above, hence
# allow_other_uses on both. GPIO7 (WAKEUP_GPIO) is an OR of the small ear and
# charger-present and would also work, but ext0 takes exactly one pin.
deep_sleep:
  id: box_deep_sleep
  wakeup_pin:
    number: GPIO20
    allow_other_uses: true
    mode:
      input: true
      pullup: true
    inverted: true
  wakeup_pin_mode: KEEP_AWAKE  # don't re-sleep while the ear is still held

# restore_value MUST stay false. A persisted true would let the box sleep
# before Home Assistant has ever connected, which is the whole thing this
# prevents -- and a sleeping box cannot be reached by OTA.
globals:
  - id: sleep_armed
    type: bool
    restore_value: false
    initial_value: 'false'

  # Last percentage measured OFF the charger. restore_value is safe here and
  # necessary: every wake from deep sleep is a cold boot, so without NVS a box
  # that lives on its charger would read unknown forever. -1 means never yet
  # measured. Inert on restore -- unlike a switch, no action fires from it.
  - id: last_battery_pct
    type: float
    restore_value: true
    initial_value: '-1'

# Ships at 5 min idle; 0 disables sleep entirely. Stock's own idle-off is
# 10 minutes.
number:
  - platform: template
    id: sleep_timeout
    name: "Sleep Timeout"
    icon: "mdi:timer-outline"
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 0
    max_value: 120
    step: 1
    unit_of_measurement: min
    mode: box
    on_value:
      - script.execute: idle_timer

  # Ceiling for every volume path: ears, Home Assistant and Music Assistant all
  # land in the media player, which clamp_volume polices.
  - platform: template
    id: max_volume
    name: "Max Volume"
    icon: "mdi:volume-high"
    optimistic: true
    restore_value: true
    initial_value: 70
    min_value: 10
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    on_value:
      - script.execute: clamp_volume

script:
  # Steady green = awake and listening. The only other feedback that a wake
  # worked is audio, so without this the box looks dead until it plays.
  # 70% because anything under ~60% is not visible through the shell -- 25%
  # measured as indistinguishable from off. box_power_down darkens it again.
  - id: led_awake
    then:
      - light.turn_on:
          id: box_led
          brightness: 70%
          red: 0%
          green: 100%
          blue: 0%

  # Pulls the volume back down whenever it exceeds the ceiling. Re-entrant --
  # volume_set fires on_state, which calls this again -- so mode: restart, and
  # the second pass no-ops because the condition is false by then.
  - id: clamp_volume
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(toniebox_media_player).volume > id(max_volume).state / 100.0f;'
          then:
            - media_player.volume_set:
                id: toniebox_media_player
                volume: !lambda 'return id(max_volume).state / 100.0f;'

  # mode: restart -- every activity reset re-arms the countdown from zero.
  - id: idle_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(sleep_timeout).state > 0;'
          then:
            - delay: !lambda 'return id(sleep_timeout).state * 60000;'
            - script.execute: box_power_down

  # The only path to sleep. Codec down, then both rails, then hold the pads
  # through sleep -- without the hold they revert. Order follows teddybox's
  # audio_board_poweroff().
  - id: box_power_down
    then:
      # THE interlock. Everything below is unreachable until Home Assistant has
      # connected once, so every boot has an OTA window no matter what got
      # persisted. Do not remove it, do not add another setter of sleep_armed,
      # and do not move this below the actions.
      - if:
          condition:
            lambda: 'return id(sleep_armed);'
          then:
            - media_player.stop:
            - light.turn_off: box_led
            - lambda: |-
                // --- dac3100_deinit() --- must precede the rail cut, the
                // codec is powered from GPIO45.
                uint8_t page0[2] = {0x00, 0x00};  // page select -> page 0
                uint8_t reset[2] = {0x01, 0x01};  // SOFTWARE_RESET
                id(toniebox_i2c)->write(0x18, page0, 2);
                id(toniebox_i2c)->write(0x18, reset, 2);

                // --- audio_board_power(false) ---
                gpio_set_level(GPIO_NUM_45, 0);  // POWER_GPIO    -> LOW
                gpio_set_level(GPIO_NUM_47, 1);  // SD_POWER_GPIO -> HIGH (active low)

                // Both pads are outside the S3 RTC domain (GPIO0-21), so the
                // hold is what keeps them put once the digital domain drops.
                gpio_hold_en(GPIO_NUM_45);
                gpio_hold_en(GPIO_NUM_47);
                gpio_deep_sleep_hold_en();
            - deep_sleep.allow: box_deep_sleep
            - deep_sleep.enter: box_deep_sleep
          else:
            - logger.log: "power down refused: HA has never connected"

  # Movement indicator. mode: restart so continued handling keeps it lit.
  - id: movement_led
    mode: restart
    then:
      - light.turn_on:
          id: box_led
          brightness: 60%
          red: 100%
          green: 100%
          blue: 100%
      - delay: 3s
      # Back to the awake indicator, NOT off -- picking the box up is how you
      # wake it, so turning off here would kill the indicator 3s after boot.
      - script.execute: led_awake

# Light the LED on REAL movement only. At rest the acceleration vector has a
# magnitude of ~1G whatever the box's orientation, so deviation from 1G means
# the box is actually being accelerated -- it does not fire on tilt, on a new
# resting position, or on the +/-0.06G of sensor noise seen while it sits
# still. Raise the threshold if a heavy footstep sets it off.
interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              float x = id(accel_x).state, y = id(accel_y).state, z = id(accel_z).state;
              if (isnan(x) || isnan(y) || isnan(z)) return false;
              return fabsf(sqrtf(x * x + y * y + z * z) - 1.0f) > 0.15f;
          then:
            - script.execute: movement_led
            - script.execute: idle_timer

# Soft power. ALWAYS_ON, never RESTORE_*: a persisted OFF would fire
# turn_off_action from setup() at priority 798, i.e. before wifi at 250 -- the
# box would sleep half a second into every boot and never get an IP. That
# happened, and esptool write_flash does not erase NVS, so it was permanent.
switch:
  - platform: template
    id: box_power
    name: "Power"
    icon: "mdi:power"
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - script.execute: idle_timer
      - script.execute: led_awake
    turn_off_action:
      - script.execute: box_power_down


light:
  - platform: rgb
    id: box_led
    name: "LED"
    red: led_red_output
    green: led_green_output
    blue: led_blue_output

# The ear buttons are physical push-buttons, not capacitive touch.
binary_sensor:
  - platform: gpio
    id: ear_big_button
    name: "Ear Big Button"
    pin:
      number: GPIO20
      allow_other_uses: true  # also the deep sleep wakeup pin
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 800ms
        then:
          - media_player.volume_up:
          - script.execute: idle_timer
      # 12s, not 5s: measured holds run 8-11s and a 5s window is unhittable.
      - min_length: 1s
        max_length: 12s
        then:
          - switch.turn_on: box_power
  - platform: gpio
    id: ear_small_button
    name: "Ear Small Button"
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 800ms
        then:
          - media_player.volume_down:
          - script.execute: idle_timer
      - min_length: 1s
        max_length: 12s
        then:
          - switch.turn_off: box_power
  - platform: gpio
    id: headphone_detect
    name: "Headphone Detect"
    pin: GPIO48

# Divider ratios from the toniebox-pcb pinout. Without them these report the
# voltage at the pin, not the rail.
sensor:
  - platform: adc
    id: charge_sense
    name: "Charge Sense"
    pin: GPIO8
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0   # R75/R72 100k/100k -- 5V charger rail
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    pin: GPIO9
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 4.03  # R57/R58 (100k+33k)/33k -- 3-cell NiMH, 3.6V nominal

  # Rough state-of-charge, NOT a gauge -- voltage is a poor SoC proxy for NiMH
  # and sags under audio load. The curve below is anchored on the stock
  # firmware's own NVS thresholds (3.60V critical, 3.67/3.70V low) with the
  # ends fitted to a 3-cell pack; treat anything between them as indicative.
  - platform: template
    id: battery_level
    name: "Battery"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    filters:
      - median:
          window_size: 5
          send_every: 1
    lambda: |-
      const float v = id(battery_voltage).state;
      if (isnan(v)) return {};

      // On the charger the pack is driven to 4.35-4.65V, far off the resting
      // curve, so voltage says nothing about state of charge. Report the last
      // reading taken off the charger rather than a fake 100%. Stale, but
      // stale in the safe direction -- it under-reports while charging.
      if (id(charge_sense).state > 4.0f) {
        if (id(last_battery_pct) < 0.0f) return {};  // never measured yet
        return id(last_battery_pct);
      }

      static const float pts[][2] = {
        {3.00f,   0.0f}, {3.30f,   5.0f}, {3.60f,  15.0f}, {3.67f, 30.0f},
        {3.70f,  45.0f}, {3.80f,  70.0f}, {3.90f,  88.0f}, {4.05f, 100.0f}};
      const int n = sizeof(pts) / sizeof(pts[0]);
      float pct = 100.0f;
      if (v <= pts[0][0]) {
        pct = 0.0f;
      } else if (v < pts[n - 1][0]) {
        for (int i = 1; i < n; i++) {
          if (v <= pts[i][0]) {
            const float t = (v - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]);
            pct = pts[i - 1][1] + t * (pts[i][1] - pts[i - 1][1]);
            break;
          }
        }
      }
      id(last_battery_pct) = pct;
      return pct;
